name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint
      - name: Run ansible-lint
        run: ansible-lint
